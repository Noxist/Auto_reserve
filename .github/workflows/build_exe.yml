name: Build & Release

on:
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE (PyInstaller)
        run: pyinstaller roombooker.spec --clean

      - name: Setup Inno Setup
        uses: Minionguyjosh/setup-innosetup@v1

      - name: Build Installer (Inno Setup)
        run: iscc installer/room_booker.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: dist/RoomBooker_Setup.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build App (PyInstaller)
        # Auf Mac gibt es kein Inno Setup, wir bauen die .app und zippen sie
        run: pyinstaller roombooker.spec --clean --noconfirm

      - name: Zip App
        run: |
          cd dist
          zip -r RoomBookerPro-Mac.zip RoomBookerPro.app

      - name: Upload Mac App
        uses: actions/upload-artifact@v4
        with:
          name: Mac-App
          path: dist/RoomBookerPro-Mac.zip

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            artifacts/Windows-Installer/RoomBooker_Setup.exe
            artifacts/Mac-App/RoomBookerPro-Mac.zip
